<VirtualHost *:80>
    ServerName docs.appsbox.com.br
    RewriteEngine On
    RewriteRule ^ https://docs.appsbox.com.br%{REQUEST_URI} [R=301,END,NE]
    ErrorLog ${APACHE_LOG_DIR}/appsbox-conv-documentos-error.log
    CustomLog ${APACHE_LOG_DIR}/appsbox-conv-documentos-access.log combined
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName docs.appsbox.com.br
    DocumentRoot /var/www/appsbox-conv-documentos/current
    DirectoryIndex index.html
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/appsbox.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/appsbox.com.br/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass /api/ http://127.0.0.1:9700/api/
    ProxyPassReverse /api/ http://127.0.0.1:9700/api/
    ProxyPass /health http://127.0.0.1:9700/health
    ProxyPassReverse /health http://127.0.0.1:9700/health
    # Documentos legais centralizados em appsbox.com.br (a página local /cookies/ foi removida)
    RedirectMatch 301 ^/cookies/?$ https://appsbox.com.br/cookies
    <Directory /var/www/appsbox-conv-documentos/current>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <FilesMatch "^(index\.html|manifest\.webmanifest|service-worker\.js)$">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>
    <FilesMatch "\.(js|css)$">
        Header always set Cache-Control "public, max-age=86400"
    </FilesMatch>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    ErrorLog ${APACHE_LOG_DIR}/appsbox-conv-documentos-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/appsbox-conv-documentos-ssl-access.log combined
</VirtualHost>
</IfModule>
